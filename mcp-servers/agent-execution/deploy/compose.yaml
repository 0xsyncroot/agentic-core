services:
  agent-execution:
    image: agent-execution:local
    build:
      context: ../../..
      dockerfile: mcp-servers/agent-execution/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-agent-execution-base:node22-python311-v1}
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/execution-files:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks: [execution-internal]
    environment:
      EXECUTION_SERVICE_TOKEN: ${EXECUTION_SERVICE_TOKEN:?Set a random service token with at least 32 bytes}
      EXECUTION_ALLOWED_HOSTS: ${EXECUTION_ALLOWED_HOSTS:-localhost,127.0.0.1,agent-execution}
    # Backend containers join execution-internal and call http://agent-execution:8080.
networks:
  execution-internal:
    internal: true
