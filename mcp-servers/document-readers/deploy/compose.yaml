services:
  document-readers:
    image: document-readers:local
    build: ..
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 64
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks: [reader-internal, archive]   # archive: a network that can reach the object store
    environment:
      DOCUMENT_READERS_TOKEN: ${DOCUMENT_READERS_TOKEN:?Set a random service token with at least 32 bytes}
      DOCUMENT_READERS_ALLOWED_HOSTS: ${DOCUMENT_READERS_ALLOWED_HOSTS:-localhost,127.0.0.1,document-readers}
      # Read-only access to the attachment archive: the shared S3_* names the backend uses too.
      DOCUMENT_S3_PREFIX: ${DOCUMENT_S3_PREFIX:?Set the archive prefix, e.g. agentic-attachments/}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    # Backend containers join reader-internal and call http://document-readers:8080.
networks:
  reader-internal:
    internal: true
  archive: {}
