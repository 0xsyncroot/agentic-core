<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Agentic Core</title>
    <meta name="description" content="Agentic Core">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/" aria-label="Agentic Core">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>Agentic Core</span>
        </a>
        <button class="new-session" id="new-session" type="button">
          <span aria-hidden="true">＋</span> New conversation
        </button>
        <section class="tools-panel" aria-labelledby="tools-title">
          <h2 id="tools-title">Available tools</h2>
          <div class="tool-list" id="tool-list">
            <span class="tool-loading">Loading...</span>
          </div>
        </section>
        <div class="runtime-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="connection-status">Connecting</span>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="menu-button" id="menu-button" type="button" aria-label="Open tools">☰</button>
          <div>
            <strong>Agentic Core</strong>
            <span id="model-status">Ready to help</span>
          </div>
          <button class="mobile-new-session" id="mobile-new-session" type="button" aria-label="New conversation">＋</button>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-mark" aria-hidden="true">A</div>
            <h1>Hello</h1>
            <p>How can I help?</p>
            <div class="suggestions" id="suggestions"></div>
          </div>
        </section>

        <footer class="composer-wrap">
          <form class="composer" id="composer">
            <label class="sr-only" for="message">Message</label>
            <textarea id="message" rows="1" maxlength="32000" placeholder="Message Agentic Core..." required></textarea>
            <div class="composer-actions">
              <span class="hint">Enter to send · Shift + Enter for a new line</span>
              <button class="send" id="send" type="submit" aria-label="Send message">
                <span class="send-label">Send</span>
                <span aria-hidden="true">↑</span>
              </button>
            </div>
          </form>
        </footer>
      </section>
      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close tools"></button>
    </main>

    <template id="message-template">
      <article class="message-row">
        <div class="message-meta"><span class="avatar"></span><span class="role"></span><time></time></div>
        <div class="bubble"></div>
      </article>
    </template>
  </body>
</html>
