# Optional local database services. The basic harness uses in-memory storage until configured.
name: agentic-local
services:
  mysql:
    # Pinned MySQL version for repeatable adapter integration tests.
    image: mysql:8.0.33
    environment:
      MYSQL_DATABASE: agentic
      MYSQL_ROOT_PASSWORD: agentic_admin_dev
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pagentic_admin_dev"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      # A new volume: the earlier one holds MySQL 8.4 files, which 8.0 cannot open.
      - agentic_mysql80_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
  mysql-test:
    # The MySQL adapter tests apply the production grant script (it revokes everything first), so
    # they get a server of their own that keeps nothing: TEST_MYSQL_URL=…@127.0.0.1:53307/agentic.
    profiles: ["test"]
    image: mysql:8.0.33
    environment:
      MYSQL_DATABASE: agentic
      MYSQL_ROOT_PASSWORD: agentic_admin_dev
    ports:
      - "127.0.0.1:53307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pagentic_admin_dev"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4-alpine
    # Appended to disk every second and never evicting: a full Redis refuses writes rather than
    # silently dropping a stream journal or an admission lease, as production is configured.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentic_redis_data:/data
  postgres:
    # Optional PostgreSQL adapter test service.
    profiles: ["postgres"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic_admin
      POSTGRES_PASSWORD: agentic_admin_dev
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_admin -d agentic"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentic_pg18data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  agentic_mysql80_data:
  agentic_redis_data:
  agentic_pg18data:
